<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>壳壳 Mockup Studio</title>
  <style>
    :root { --ink:#18212e; --muted:#6d7887; --paper:#f5f7fa; --accent:#ffbf1f; --card:#fff; }
    * { box-sizing:border-box } body { margin:0; font-family:"Microsoft YaHei",system-ui,sans-serif; background:var(--paper); color:var(--ink) }
    header { padding:28px max(24px,calc((100vw - 1260px)/2)); background:#111a26; color:#fff; display:flex; justify-content:space-between; align-items:center }
    h1 { margin:0; font-size:24px; letter-spacing:.3px } header p { margin:5px 0 0; color:#aab5c3; font-size:13px }
    main { max-width:1260px; padding:26px 24px 48px; margin:auto; display:grid; grid-template-columns:310px 1fr; gap:24px }
    .panel,.result { background:var(--card); border:1px solid #e4e8ee; box-shadow:0 8px 24px #1a2a3a0a; border-radius:16px }
    .panel { padding:20px; align-self:start; position:sticky; top:16px } h2 { margin:0 0 16px; font-size:16px }
    .field { margin:14px 0 } label { display:block; font-size:13px; font-weight:700; margin-bottom:7px } small { color:var(--muted); display:block; font-size:11px; line-height:1.5; margin-top:5px }
    input[type=file] { width:100%; font-size:12px; color:var(--muted) } input[type=range] { width:100%; accent-color:#f2af00 }
    .range-row { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:4px }
    button { border:0; border-radius:9px; padding:12px 14px; font:inherit; font-weight:700; cursor:pointer; width:100%; background:var(--accent); color:#342400; margin-top:12px; transition:.18s } button:hover { filter:brightness(.96); transform:translateY(-1px) }
    button.secondary { background:#ecf0f4; color:#273444; margin-top:8px } .tips { background:#fff7da; padding:10px; border-radius:9px; color:#765700; font-size:12px; line-height:1.6; margin-top:14px } button.on{background:var(--accent)!important;color:#342400!important}
    .workspace { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px }.result { overflow:hidden; padding:14px }.result.wide { grid-column:span 2 }
    .result-head { display:flex; align-items:center; justify-content:space-between; margin:0 2px 11px }.result h3 { font-size:14px; margin:0 }.download { width:auto; padding:7px 10px; margin:0; font-size:12px; background:#eaf2ff; color:#245a9d }
    canvas { width:100%; max-width:400px; margin:0 auto; display:block; background:#f8f8f8; border-radius:10px; aspect-ratio:1; object-fit:contain }
    .detail-scroll { height:780px; overflow-y:auto; border-radius:10px; background:#f8f8f8; border:1px solid #eef1f5 }
    .detail-scroll canvas { max-width:none; width:100%; aspect-ratio:auto }
    /* 透明底预览：棋盘格表示该输出导出为无背景 PNG */
    #mockup { background:conic-gradient(#e6e8ec 0 25%, #ffffff 0 50%, #e6e8ec 0 75%, #ffffff 0) 0 0/22px 22px; }
    .status { font-size:12px; color:var(--muted); padding:5px 0 0 } @media(max-width:850px){main{grid-template-columns:1fr}.panel{position:static}.workspace{grid-template-columns:1fr}.result.wide{grid-column:auto}header{display:block}}
  </style>
</head>
<body>
  <header><div><h1>壳壳 Mockup Studio</h1><p>替换素材后，一键生成真实贴图效果与三种展示图</p></div><div class="status" id="status">正在载入默认素材…</div></header>
  <main>
    <aside class="panel">
      <h2>素材与模板</h2>
      <div style="display:flex;gap:10px;margin-bottom:2px"><button id="moldClear" class="secondary on" style="margin-top:0">透明壳</button><button id="moldCarbon" class="secondary" style="margin-top:0">碳纤维黑磨砂</button></div>
      <div class="field"><label>设计素材图</label><input id="art" type="file" accept="image/*"></div>
      <div class="field"><label>壳体底图</label><input id="base" type="file" accept="image/*"></div>
      <div class="field"><label>壳体蒙版</label><input id="mask" type="file" accept="image/*"></div>
      <div class="field"><label>纸感噪声</label><input id="noise" type="file" accept="image/*"></div>
      <div class="field"><label>展示背景</label><input id="bg" type="file" accept="image/*"></div>
      <div class="field"><label>侧面壳体</label><input id="side" type="file" accept="image/*"></div>
      <div class="field"><label>水印图片</label><input id="watermark" type="file" accept="image/*"></div>
      <div class="field"><label>水印透明度</label><input id="wmOpacity" type="range" min="0" max="100" value="0"><div class="range-row"><span>0%</span><span id="wmOpacityText">0%</span><span>100%</span></div></div>
      <div class="field"><label>水印水平</label><input id="wmX" type="range" min="-200" max="200" value="0" step="1"><div class="range-row"><span>-200</span><span id="wmXText">0</span><span>+200</span></div></div>
      <div class="field"><label>水印垂直</label><input id="wmY" type="range" min="-200" max="200" value="0" step="1"><div class="range-row"><span>-200</span><span id="wmYText">0</span><span>+200</span></div></div>
      <div class="field"><label>水印大小</label><input id="wmSize" type="range" min="10" max="200" value="60"><div class="range-row"><span>10%</span><span id="wmSizeText">60%</span><span>200%</span></div></div>
      <div class="field"><label>素材缩放</label><input id="scale" type="range" min="85" max="125" value="100"><div class="range-row"><span>85%</span><span id="scaleText">100%</span><span>125%</span></div></div>
      <div class="field"><label>素材上下位置</label><input id="offset" type="range" min="-12" max="12" value="0"><div class="range-row"><span>上移</span><span id="offsetText">0%</span><span>下移</span></div></div>
      <div class="field"><label>纸感强度</label><input id="grain" type="range" min="0" max="55" value="0"><div class="range-row"><span>平滑</span><span id="grainText">0%</span><span>颗粒</span></div></div>
      <div class="field"><label>整体缩放</label><input id="overall" type="range" min="70" max="100" value="93"><div class="range-row"><span>70%</span><span id="overallText">93%</span><span>100%</span></div></div>
      <div class="field"><label>背景图缩放</label><input id="bgScale" type="range" min="50" max="200" value="100"><div class="range-row"><span>50%</span><span id="bgScaleText">100%</span><span>200%</span></div></div>
      <div class="field"><label>详情壳水平</label><input id="detailX" type="range" min="-200" max="200" value="0" step="1"><div class="range-row"><span>-200</span><span id="detailXText">0</span><span>+200</span></div></div>
      <div class="field"><label>详情壳垂直</label><input id="detailY" type="range" min="-200" max="200" value="0" step="1"><div class="range-row"><span>-200</span><span id="detailYText">0</span><span>+200</span></div></div>
      <div style="display:flex;gap:10px;margin-top:12px"><button id="tb" class="secondary on" style="margin-top:0">淘宝版</button><button id="dd" class="secondary" style="margin-top:0">多多版</button></div><button id="saveAll" class="secondary">一键保存全部到文件夹</button><button id="zipAll" class="secondary">打包下载 ZIP</button><button class="secondary" id="reset">恢复默认素材</button>
      <div class="tips">提示：设计稿会按壳体印刷区等比“铺满”（超出短边自动裁切），图案只会出现在蒙版白色区域。壳体、蒙版与噪声需使用同一模板尺寸。</div>
      <div class="field"><label>从 Pinterest 找图</label>
        <button id="openPin" style="margin-top:0;background:#eaf2ff;color:#245a9d">打开 Pinterest 浏览</button>
        <input id="pinUrl" type="text" placeholder="在图上右键→复制图片地址，粘贴到这里" style="width:100%;margin-top:8px;font-size:12px;padding:8px;border:1px solid #d8dde4;border-radius:8px">
        <button id="usePin" style="margin-top:8px">预览此图</button>
      </div>
    </aside>
    <section class="workspace">
      <article class="result"><div class="result-head"><h3>01 · 真实效果图</h3><button class="download" data-out="mockup">下载</button></div><canvas id="mockup" width="1000" height="1000"></canvas></article>
      <article class="result"><div class="result-head"><h3>02 · 白底产品图</h3><button class="download" data-out="white">下载</button></div><canvas id="white" width="1000" height="1000"></canvas></article>
      <article class="result"><div class="result-head"><h3>03 · 背景展示图</h3><button class="download" data-out="scene">下载</button></div><canvas id="scene" width="1000" height="1000"></canvas></article>
      <article class="result"><div class="result-head"><h3>04 · 正侧组合图</h3><button class="download" data-out="combo">下载</button></div><canvas id="combo" width="1000" height="1000"></canvas></article>
      <article class="result wide"><div class="result-head"><h3>05 · 详情图</h3><button class="download" data-out="detail">下载</button></div><div class="detail-scroll"><canvas id="detail" width="1200" height="5615" style="aspect-ratio:auto"></canvas></div></article>
    </section>
  </main>
  <script src="jszip.min.js"></script>
  <script>
    const $ = id => document.getElementById(id), assets = {};
    const defaults = {art:'参考图2.png',base:'素材底图.png',mask:'素材图片蒙版.png',noise:'素材图片噪声.png',shadow:'高反差.png',bg:'背景图.png',side:'素材底图2.png',detailBg:'详情底图.png',innerShadow:'内阴影.png',ddBg:'多多背景图.png',ddDetail:'多多详情.png',wmT1:'t1.png',wmT2:'t2.png'};
    let mold='clear'; const moldSets={ clear:{base:'素材底图.png',mask:'素材图片蒙版.png',side:'素材底图2.png',shadow:'高反差.png'}, carbon:{base:'碳纤维模具/素材底图.png',mask:'碳纤维模具/素材图片蒙版.png',side:'碳纤维模具/素材底图2.png',shadow:'碳纤维模具/阴影.png'} };
    async function setMold(m){ mold=m; $('moldClear').classList.toggle('on',m==='clear'); $('moldCarbon').classList.toggle('on',m==='carbon'); $('status').textContent='正在加载'+(m==='carbon'?'碳纤维黑磨砂':'透明壳')+'模具素材…'; for(const k of ['base','mask','side','shadow']) assets[k]=await load(moldSets[m][k]+'?v=27'); drawAll(); }
    const load = src => new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>no(new Error('素材无法加载：'+src)); i.src=src; });
    const fit = (ctx,img,x,y,w,h,cover=true) => { const r=cover?Math.max(w/img.width,h/img.height):Math.min(w/img.width,h/img.height); const nw=img.width*r,nh=img.height*r; ctx.drawImage(img,x+(w-nw)/2,y+(h-nh)/2,nw,nh); };
    let version='taobao'; const drawBg=(x,w,h)=>{ const img=version==='duoduo'?assets.ddBg:assets.bg, bs=+$('bgScale').value/100, r=Math.max(w/img.width,h/img.height)*bs, nw=img.width*r, nh=img.height*r; x.drawImage(img,(w-nw)/2,(h-nh)/2,nw,nh); };
    // The supplied mask uses solid black pixels for lens holes (rather than transparent pixels).
    // Convert its luminance to alpha: white = printable, black = a genuine cut-out.
    function maskByLightness(size){
      const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(assets.mask,0,0,size,size);
      const p=x.getImageData(0,0,size,size); for(let i=0;i<p.data.length;i+=4){const l=(p.data[i]+p.data[i+1]+p.data[i+2])/3;p.data[i+3]=Math.round(l*p.data[i+3]/255);p.data[i]=p.data[i+1]=p.data[i+2]=255;} x.putImageData(p,0,0); return c;
    }
    function silhouette(size){ const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');x.drawImage(assets.shadow,0,0,size,size);x.globalCompositeOperation='source-in';x.fillStyle='#142030';x.fillRect(0,0,size,size);return c; }
    async function setFile(key,file){ assets[key]=await load(URL.createObjectURL(file)); drawAll(); }
    // Measured from the supplied 1000px template: the printable case area is x:302–698, y:80–918.
    // Artwork is fitted to this tall rectangle (not the square canvas), preserving its ratio.
    const printable = { x:.302, y:.080, w:.396, h:.838 };
    function artLayer(size=1600){
      const c=document.createElement('canvas');c.width=c.height=size; const x=c.getContext('2d');
      const sc=+$('scale').value/100, area={x:printable.x*size,y:printable.y*size,w:printable.w*size,h:printable.h*size};
      // "cover" makes both short edges meet the case edge; excess is cropped before applying the mask.
      const r=Math.max(area.w/assets.art.width,area.h/assets.art.height)*sc, w=assets.art.width*r,h=assets.art.height*r;
      const shift=+$('offset').value/100*area.h;
      x.drawImage(assets.art,area.x+(area.w-w)/2,area.y+(area.h-h)/2+shift,w,h);
      // 增强设计稿：对比度+饱和度，轻微压暗，抵消罩层发灰
      const img=x.getImageData(0,0,size,size), d=img.data;
      for(let i=0;i<d.length;i+=4){
        let r=d[i],g=d[i+1],b=d[i+2];
        r=(r-128)*1.08+128; g=(g-128)*1.08+128; b=(b-128)*1.08+128;
        const gray=0.299*r+0.587*g+0.114*b;
        r=gray+(r-gray)*0.85; g=gray+(g-gray)*0.85; b=gray+(b-gray)*0.85;
        r*=0.95; g*=0.95; b*=0.95;
        d[i]=Math.max(0,Math.min(255,r)); d[i+1]=Math.max(0,Math.min(255,g)); d[i+2]=Math.max(0,Math.min(255,b));
      }
      x.putImageData(img,0,0); return c;
    }
    function makeDevice(size=1000){
      const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';
      // The design stays 100% opaque; black lens holes and exterior transparency are cut away by the mask.
      const alphaMask=maskByLightness(size), masked=document.createElement('canvas');masked.width=masked.height=size;const m=masked.getContext('2d');m.drawImage(artLayer(size),0,0);m.globalCompositeOperation='destination-in';m.drawImage(alphaMask,0,0);
      x.drawImage(assets.base,0,0,size,size);
      const wash=document.createElement('canvas');wash.width=wash.height=size;const wc=wash.getContext('2d');wc.globalAlpha=.12;wc.fillStyle='#fff';wc.fillRect(0,0,size,size);wc.globalCompositeOperation='destination-in';wc.drawImage(assets.base,0,0,size,size);x.drawImage(wash,0,0);
      const artSh=document.createElement('canvas');artSh.width=artSh.height=size;const asx=artSh.getContext('2d');asx.drawImage(masked,0,0);asx.globalCompositeOperation='source-in';asx.fillStyle='rgba(0,0,0,.18)';asx.fillRect(0,0,size,size);
      x.drawImage(artSh,2,2);
      x.drawImage(masked,0,0);
      // The dedicated shadow layer supplies the clear-case reflections and contact shadows.
      // It is separate from the base, so no original base artwork can show through the uploaded design.
      const baseLight=document.createElement('canvas');baseLight.width=baseLight.height=size;const b=baseLight.getContext('2d');b.drawImage(assets.shadow,0,0,size,size);
      b.globalCompositeOperation='destination-in';b.drawImage(alphaMask,0,0);
      x.save();x.globalCompositeOperation='hard-light';x.globalAlpha=.85;x.drawImage(baseLight,0,0);x.restore();
      // 内阴影：用蒙版裁出可印区，multiply 压暗壳边转折
      const innerSh=document.createElement('canvas');innerSh.width=innerSh.height=size;const is=innerSh.getContext('2d');is.drawImage(assets.innerShadow,0,0,size,size);is.globalCompositeOperation='destination-in';is.drawImage(alphaMask,0,0);
      x.save();x.globalCompositeOperation='multiply';x.globalAlpha=.30;x.drawImage(innerSh,0,0);x.restore();
      // 从上到下的柔和反光（screen，只提亮）
      const sheen=document.createElement('canvas');sheen.width=sheen.height=size;const sn=sheen.getContext('2d');let sg=sn.createLinearGradient(0,0,0,size);sg.addColorStop(0,'rgba(255,255,255,.20)');sg.addColorStop(.35,'rgba(255,255,255,0)');sg.addColorStop(1,'rgba(255,255,255,0)');sn.fillStyle=sg;sn.fillRect(0,0,size,size);sn.globalCompositeOperation='destination-in';sn.drawImage(alphaMask,0,0);
      x.save();x.globalCompositeOperation='screen';x.globalAlpha=.6;x.drawImage(sheen,0,0);x.restore();
      // Restore pixels outside the printable (white) mask: lenses, flash and transparent exterior.
      const hardware=document.createElement('canvas');hardware.width=hardware.height=size;const h=hardware.getContext('2d');h.drawImage(assets.base,0,0,size,size);h.globalCompositeOperation='destination-out';h.drawImage(alphaMask,0,0);x.drawImage(hardware,0,0);
      // Controlled lighting, clipped to the print area, deepens the base-layer light direction.
      const light=document.createElement('canvas');light.width=light.height=size;const l=light.getContext('2d');let g=l.createLinearGradient(0,0,size,0);
      g.addColorStop(0,'rgba(255,255,255,.20)');g.addColorStop(.14,'rgba(255,255,255,.03)');g.addColorStop(.58,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.07)');l.fillStyle=g;l.fillRect(0,0,size,size);
      g=l.createLinearGradient(0,0,0,size);g.addColorStop(0,'rgba(255,255,255,.09)');g.addColorStop(.68,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.07)');l.fillStyle=g;l.fillRect(0,0,size,size);
      const cx=.47*size,cy=.255*size;g=l.createRadialGradient(cx,cy,size*.03,cx,cy,size*.19);g.addColorStop(0,'rgba(0,0,0,.08)');g.addColorStop(1,'rgba(0,0,0,0)');l.fillStyle=g;l.fillRect(0,0,size,size);
      l.globalCompositeOperation='destination-in';l.drawImage(alphaMask,0,0);x.save();x.globalCompositeOperation='multiply';x.drawImage(light,0,0);x.restore();x.save();x.globalCompositeOperation='screen';x.globalAlpha=.18;x.drawImage(light,0,0);x.restore();
      // 水印层：按透明度/位置/大小，叠在印刷区并被蒙版裁掉
      const wmImg = assets.wmCustom || (version==='duoduo'?assets.wmT2:assets.wmT1);
      if(wmImg && +$('wmOpacity').value>0){ const wm=document.createElement('canvas');wm.width=wm.height=size;const wc=wm.getContext('2d');
        const pw=printable.w*size, ph=printable.h*size, pcx=(printable.x+printable.w/2)*size, pcy=(printable.y+printable.h/2)*size;
        const wsize=pw*+$('wmSize').value/100; const wr=wsize/wmImg.width, wh=wmImg.height*wr;
        const wx=pcx-wsize/2+ +$('wmX').value, wy=pcy-wh/2+ +$('wmY').value;
        wc.globalAlpha=+$('wmOpacity').value/100; wc.drawImage(wmImg,wx,wy,wsize,wh);
        wc.globalCompositeOperation='destination-in'; wc.drawImage(alphaMask,0,0);
        x.save(); x.drawImage(wm,0,0); x.restore(); }
      if(assets.noise){ const grain=document.createElement('canvas');grain.width=grain.height=size;const g=grain.getContext('2d',{willReadFrequently:true});g.drawImage(assets.noise,0,0,size,size);
        const np=g.getImageData(0,0,size,size);let sum=0;for(let j=0;j<np.data.length;j+=4){const v=(np.data[j]+np.data[j+1]+np.data[j+2])/3;np.data[j]=np.data[j+1]=np.data[j+2]=v;sum+=v;}const off=128-sum/(np.data.length/4);for(let j=0;j<np.data.length;j+=4){const v=Math.max(0,Math.min(255,np.data[j]+off));np.data[j]=np.data[j+1]=np.data[j+2]=v;}g.putImageData(np,0,0);
        g.globalCompositeOperation='destination-in';g.drawImage(alphaMask,0,0);x.save();x.globalCompositeOperation='overlay';x.globalAlpha=+$('grain').value/100;x.drawImage(grain,0,0);x.restore(); }
      return c;
    }
    function shadow(ctx,x,y,w,h,a=.22){ctx.save();ctx.fillStyle=`rgba(15,30,45,${a})`;ctx.filter='blur('+Math.round(w*.045)+'px)';ctx.beginPath();ctx.roundRect(x+w*.1,y+h*.09,w*.8,h*.85,w*.1);ctx.fill();ctx.restore();}
    function deviceShadow(ctx,size,opacity=.22,offsetY=Math.round(size*.032),x=0,y=0){ const s=silhouette(size);ctx.save();ctx.globalAlpha=opacity;ctx.shadowColor='rgba(18,38,58,1)';ctx.shadowBlur=size*.045;ctx.drawImage(s,x,y+offsetY,size,size);ctx.restore(); }
    function drawTo(id, painter){const c=$(id),x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.clearRect(0,0,c.width,c.height);painter(x,c.width,c.height);}
    function paintScaled(ctx,w,h,paint){ const scale=+$('overall').value/100;ctx.save();ctx.translate(w/2,h/2);ctx.scale(scale,scale);ctx.translate(-w/2,-h/2);paint();ctx.restore(); }
    function drawAll(){ if(Object.keys(assets).length<13)return; const dev=makeDevice(1000);
      // 真实效果图：保留壳体/贴图/光影渲染，但不铺背景，导出为透明底 PNG
      drawTo('mockup',(x,w,h)=>{paintScaled(x,w,h,()=>x.drawImage(dev,0,0,w,h))});
      // Full-size placement matches the supplied 2000px reference compositions.
      drawTo('white',(x,w,h)=>{x.fillStyle='#fff';x.fillRect(0,0,w,h);paintScaled(x,w,h,()=>x.drawImage(dev,0,0,w,h))});
      drawTo('scene',(x,w,h)=>{drawBg(x,w,h);paintScaled(x,w,h,()=>x.drawImage(dev,0,0,w,h))});
      // 正侧组合图（参考图4 版式，1000px 画布）：左侧边条 + 右侧正面，等高并排。
      // 素材底图2.png 为 2000px，侧边壳体在源图 x464..612、y206..1830（其余透明）。
      // 侧边壳 y104..934（高830）；正面壳缩到 956 后 y104..934，与侧边上下对齐。
      // dev(1000) 内正面壳 y84..952；缩放 830/868≈0.956，画 956x956 于(104,24)。
      drawTo('combo',(x,w,h)=>{drawBg(x,w,h);paintScaled(x,w,h,()=>{
        x.drawImage(assets.side, 464,206,148,1624, 236,104,75,820);
        x.drawImage(dev,101,23,967,967);
      })});
      // 05 详情图：详情底图(1200x5615) + 正侧组合图按参考图6位置(216,2207,800x800)叠放
      // 05 详情图：按版本选底图与产品位置
      const dc=$('detail'); dc.height = (version==='duoduo')?3400:5615;
      drawTo('detail',(x,w,h)=>{ const ov=+$('overall').value/100, ox=+$('detailX').value, oy=+$('detailY').value;
      if(version==='duoduo'){ x.drawImage(assets.ddDetail,0,0,w,h); const bs=1090*ov,nx=55+1090/2-bs/2+ox,ny=1235+1090/2-bs/2+oy; x.drawImage(dev,nx,ny,bs,bs); }
      else { x.drawImage(assets.detailBg,0,0,w,h); x.save(); x.translate(ox,oy); x.translate(600,2612); x.scale(ov,ov); x.translate(-600,-2612);
        x.drawImage(assets.side,464,206,148,1624,405,2290,60,656); x.drawImage(dev,297,2225,774,774); x.restore(); } });
      const ds=document.querySelector('.detail-scroll'); if(ds){ const dh=ds.clientWidth*(dc.height)/1200; const cy=(version==='duoduo')?1700:2600; requestAnimationFrame(()=>{ ds.scrollTop=dh*(cy/dc.height)-ds.clientHeight/2; }); }
      $('status').textContent='已生成 · 可直接下载 PNG';
    }
    ['art','base','mask','noise','bg','side'].forEach(k=>$(k).addEventListener('change',e=>e.target.files[0]&&setFile(k,e.target.files[0])));
$('watermark').addEventListener('change',e=>{ if(e.target.files[0]){ setFile('wmCustom',e.target.files[0]); } });
    ['scale','offset','grain','overall','bgScale','wmOpacity','wmSize'].forEach(k=>$(k).addEventListener('input',()=>{$(k+'Text').textContent=$(k).value+'%';drawAll()}));
['detailX','detailY'].forEach(k=>$(k).addEventListener('input',()=>{ let v=+$(k).value; if(Math.abs(v)<=4){$(k).value=0;v=0;} $(k+'Text').textContent=v;drawAll();}));
$('wmX').addEventListener('input',()=>{ let v=+$('wmX').value; if(Math.abs(v)<=4){$('wmX').value=0;v=0;} $('wmXText').textContent=v;drawAll();});
$('wmY').addEventListener('input',()=>{ let v=+$('wmY').value; if(Math.abs(v)<=4){$('wmY').value=0;v=0;} $('wmYText').textContent=v;drawAll();});
    ['detailX','detailY','wmX','wmY'].forEach(k=>{
      $(k).addEventListener('change',()=>{
        const v=+$(k).value;
        if(Math.abs(v)<=5){ $(k).value=0; $(k+'Text').textContent='0'; drawAll(); }
      });
    });
    $('saveAll').onclick = async () => {
      const files=[['01-真实效果图.png','mockup'],['02-白底产品图.png','white'],['03-背景展示图.png','scene'],['04-正侧组合图.png','combo'],['05-详情图.png','detail']];
      try { if(!window.showDirectoryPicker) throw new Error('unsupported'); const folder=await window.showDirectoryPicker({mode:'readwrite'});
        for(const [name,id] of files){const handle=await folder.getFileHandle(name,{create:true});const writer=await handle.createWritable();const blob=await new Promise(ok=>$(id).toBlob(ok,'image/png'));await writer.write(blob);await writer.close();}
        $('status').textContent='已保存到所选文件夹';
      } catch(e) { if(e.name==='AbortError') return; files.forEach(([name,id])=>{const a=document.createElement('a');a.download=name;a.href=$(id).toDataURL('image/png');a.click();}); $('status').textContent='浏览器不支持文件夹选择，已改为逐张下载'; }
    };
    $('zipAll').onclick = async () => {
      const files=[['01-真实效果图.png','mockup'],['02-白底产品图.png','white'],['03-背景展示图.png','scene'],['04-正侧组合图.png','combo'],['05-详情图.png','detail']];
      const zip = new JSZip();
      for(const [name,id] of files){ const blob = await new Promise(ok => $(id).toBlob(ok,'image/png')); zip.file(name, blob); }
      const content = await zip.generateAsync({type:'blob'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(content); a.download = 'mockup-result.zip'; a.click();
      $('status').textContent = '已打包 ZIP 开始下载';
    };
    $('tb').onclick=()=>{version='taobao';$('tb').classList.add('on');$('dd').classList.remove('on');drawAll();};$('dd').onclick=()=>{version='duoduo';$('dd').classList.add('on');$('tb').classList.remove('on');drawAll();};$('reset').onclick=init;
    $('moldClear').onclick=()=>setMold('clear');$('moldCarbon').onclick=()=>setMold('carbon');
    $('usePin').onclick=()=>{ const u=$('pinUrl').value.trim(); if(!u){$('status').textContent='请先粘贴图片地址';return;} const img=new Image(); img.crossOrigin='anonymous'; img.onload=()=>{assets.art=img;drawAll();$('status').textContent='已应用图片';}; img.onerror=()=>{$('status').textContent='加载失败';}; img.src='https://images.weserv.nl/?url='+encodeURIComponent(u.replace(/^https?:\/\//,'')); }
    async function init(){ mold='clear';$('moldClear').classList.add('on');$('moldCarbon').classList.remove('on'); try { $('status').textContent='正在载入默认素材…'; for(const [k,v] of Object.entries(defaults))assets[k]=await load(v+'?v=27'); drawAll(); } catch(e) { $('status').textContent=e.message; } }
    init();
  </script>
</body></html>
